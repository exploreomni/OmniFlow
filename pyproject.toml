[build-system]
requires = ["setuptools>=83,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniflow-ci"
dynamic = ["version"]
description = "Security-first CI/CD orchestrator for Omni semantic-layer development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OmniFlow contributors" }]
keywords = ["analytics", "ci", "semantic-layer", "omni", "data-governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0.3,<7",
  "requests>=2.34.2,<3",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8,<2",
  "build>=1.2,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
  "twine>=5,<8",
]

[project.scripts]
omniflow = "omniflow.cli:main"

[project.urls]
Documentation = "https://github.com/exploreomni/OmniFlow#readme"
Issues = "https://github.com/exploreomni/OmniFlow/issues"
Repository = "https://github.com/exploreomni/OmniFlow"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "omniflow.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["omniflow"]

[tool.coverage.report]
fail_under = 65
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.bandit]
exclude_dirs = ["tests"]
