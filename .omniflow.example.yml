contracts:
  enabled: true
  fail_on:
    deleted_referenced_fields: true
    renamed_referenced_fields: true
    referenced_field_type_changes: true
    referenced_join_cardinality_changes: true
    coverage_gaps: true

checks:
  content_validation:
    enabled: true
    fail_on_new_only: true
    labels:
      - Verified
      - Executive

  model_validation:
    enabled: true
    fail_on_warnings: false

  semantic_lint:
    enabled: true
    rules:
      require_field_descriptions: warn
      require_primary_keys: warn
      block_deleted_fields: warn
      warn_relationship_cardinality_change: warn
      require_topic_labels: warn

  # Optional: add published Omni dashboard-to-dbt model lineage to reports.
  # Requires a configured Omni dbt integration and Connection Admin permission.
  # Leave this commented out when the Omni connection does not use dbt.
  # dbt_exposures:
  #   enabled: true
  #   fail_on_unavailable: false

  # Optional: block a dbt-only pull request that removes a warehouse column or
  # model the committed Omni YAML still references. Runs without an Omni
  # credential and needs no dbt invocation. Uses deployment.breaking_change_hold
  # dbt_paths to identify dbt sources. See docs/DBT_IMPACT.md.
  # dbt_impact:
  #   enabled: true
  #   manifest_path: target/manifest.json   # omit to use SQL heuristics
  #   fail_on_orphaned_references: true
  #   omni_yaml_paths:                      # defaults to .omni/flow.json model paths
  #     - omni/my_model
  #   table_mapping:                        # only for custom schema macros
  #     - dbt_model: orders_v2
  #       sql_table_name: analytics.marts.orders

reporting:
  formats:
    - json
    - markdown
    - sarif
    - junit
  output_dir: .omniflow

security:
  redact_logs: true
  allow_raw_response_output: false
  max_report_samples: 20
  redact_document_names: false
  redaction_level: standard
  retain_restricted_artifacts: false

# Optional post-deployment sync for repositories that deploy dbt models.
# Invoke only after the production dbt job succeeds. It is disabled by default
# and has no effect on repositories that do not use dbt.
# deployment:
#   dbt_sync:
#     enabled: true
#     refresh_mode: hard
#     poll_interval_seconds: 5
#     timeout_seconds: 900
#     post_sync_validation: true
#
#   # Optional single-branch safety policy for monorepos that hold dbt and Omni
#   # model YAML on the same protected branch. Blocks a merge that would promote
#   # breaking Omni changes before the matching dbt deployment reaches the
#   # warehouse. Disabled by default. See docs/BREAKING_CHANGE_HOLD.md.
#   breaking_change_hold:
#     enabled: true
#     action: fail          # fail blocks the merge; warn only reports
#     dbt_paths:            # keep consistent with the deployment push.paths filter
#       - models
#       - seeds
#       - snapshots
#       - macros
#     pending_label: omniflow/awaiting-deploy

# Unreleased development scaffold: human-authorized Omni Modeling Agent repair.
# Do not enable for customer use until Omni publishes a supported Modeling Agent API.
