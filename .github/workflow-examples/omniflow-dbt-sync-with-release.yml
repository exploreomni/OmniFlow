name: Deploy dbt and record verified Omni synchronization

# Single-branch monorepo variant of omniflow-dbt-sync.yml.
#
# Use this workflow when dbt and Omni model YAML live on the same protected
# branch and the repository enables deployment.breaking_change_hold. It records
# the synchronized commit so fresh pull request validation can establish readiness.
# Use omniflow-revalidate-held.yml to validate the current head before manual merge.
#
# Keep the ordinary omniflow.yml validation workflow in place. This workflow
# only runs after a merge to the protected branch.

on:
  push:
    branches: [main]
    # Keep this list limited to files that can change the production dbt build.
    # It must stay consistent with deployment.breaking_change_hold.dbt_paths.
    paths:
      - dbt_project.yml
      - packages.yml
      - dependencies.yml
      - selectors.yml
      - analyses/**
      - models/**
      - macros/**
      - seeds/**
      - semantic_models/**
      - snapshots/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniflow-dbt-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: omniflow-production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      # Replace this command with the repository's reviewed production dbt deployment.
      # OmniFlow must remain after this step so a failed dbt deployment prevents refresh.
      - name: Deploy dbt to production
        run: ./scripts/deploy-dbt-production.sh

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Synchronize dbt metadata into Omni
        uses: exploreomni/OmniFlow@<pinned-commit-sha> # zizmor: ignore[unpinned-uses] customer must replace
        with:
          mode: dbt-sync
          config: .omniflow.yml
          sync-api-key: ${{ secrets.OMNIFLOW_SYNC_API_KEY }}

      # Records the commit whose dbt state is now present in Omni. Pull request
      # validation reads this value to decide whether a dbt deployment is still
      # pending for breaking Omni model changes.
      #
      # This requires a token with permission to set Actions variables. The
      # default GITHUB_TOKEN cannot write repository variables, so use a
      # dedicated fine-grained token stored as OMNIFLOW_SYNC_STATE_TOKEN with
      # read and write access to repository variables only.
      - name: Record synchronized commit
        if: success()
        env:
          GH_TOKEN: ${{ secrets.OMNIFLOW_SYNC_STATE_TOKEN }}
          SYNCED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "OMNIFLOW_SYNC_STATE_TOKEN is required; deployment readiness remains blocked" >&2
            exit 1
          fi
          gh variable set OMNIFLOW_LAST_SYNC_SHA --body "$SYNCED_SHA"
          RECORDED_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/variables/OMNIFLOW_LAST_SYNC_SHA" --jq .value)"
          test "$RECORDED_SHA" = "$SYNCED_SHA"

      # State persistence never releases a PR by itself. Dispatch a fresh current-
      # head readiness check; an old workflow rerun retains its old event snapshot.
      - name: Explain the required fresh validation
        if: success()
        run: |
          echo "Sync state is verified. Dispatch OmniFlow current-head readiness with the held PR number."
          echo "Labels remain until current-head validation succeeds. Merge remains manual."

      - name: Upload synchronization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omniflow-dbt-sync-evidence
          path: |
            .omniflow/public/report.json
            .omniflow/public/report.md
            .omniflow/public/report.sarif
            .omniflow/public/junit.xml
            .omniflow/public/evidence.json
            .omniflow/public/dbt-sync.json
            .omniflow/artifact-manifest.json
          if-no-files-found: ignore
          include-hidden-files: true
