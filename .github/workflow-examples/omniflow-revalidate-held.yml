name: OmniFlow current-head readiness

on:
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: Open same-repository pull request to validate before manual merge
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: omniflow-readiness-${{ inputs['pull-request-number'] }}
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: omniflow-production
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout current trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned OmniFlow
        uses: exploreomni/OmniFlow@<pinned-commit-sha> # zizmor: ignore[unpinned-uses] customer must replace
        with:
          config: .omniflow.yml
          skip-reason: Protected current-head revalidation follows
      - name: Validate current PR head and verified sync state
        env:
          PR_NUMBER: ${{ inputs['pull-request-number'] }}
          OMNIFLOW_GITHUB_TOKEN: ${{ github.token }}
          OMNIFLOW_SYNC_STATE_TOKEN: ${{ secrets.OMNIFLOW_SYNC_STATE_TOKEN }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: |
          set -euo pipefail
          python -m omniflow.github.revalidation --pull-request "$PR_NUMBER"
      - name: Upload current-head validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: omniflow-current-head-readiness
          path: .omniflow/public/
          include-hidden-files: true
          if-no-files-found: error
