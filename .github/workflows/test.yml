name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input --upgrade "pip==26.1.2" "setuptools==83.0.0"
          python -m pip install --disable-pip-version-check --no-input -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest --cov=omniflow --cov-report=term-missing

      - name: Security lint
        run: bandit -c pyproject.toml -r src

      - name: Alpha simulation
        if: matrix.python-version == '3.12'
        run: python scripts/simulate_alpha.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build and inspect distributions
        run: |
          python -m pip install --disable-pip-version-check --no-input --upgrade "pip==26.1.2" "setuptools==83.0.0"
          python -m pip install --disable-pip-version-check --no-input ".[dev]"
          python -m build
          twine check dist/*

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/omniflow-wheel-test
          /tmp/omniflow-wheel-test/bin/python -m pip install --disable-pip-version-check --no-input dist/*.whl
          /tmp/omniflow-wheel-test/bin/omniflow --version

  action-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Exercise automatic non-Omni routing without a secret
        uses: ./
      - name: Verify public-only skip artifacts
        run: |
          test -f .omniflow/public/report.json
          test -f .omniflow/artifact-manifest.json
          test ! -d .omniflow/restricted
