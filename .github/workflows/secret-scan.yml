name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The standalone CLI is MIT licensed; the separate Action wrapper requires
      # an organization license. Keep the same scanner version without that wrapper.
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          SCANNER_DIR="$(mktemp -d "${RUNNER_TEMP}/omniflow-gitleaks.XXXXXX")"
          ARCHIVE="${SCANNER_DIR}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 15 --max-time 120 --proto '=https' --proto-redir '=https' \
            --output "$ARCHIVE" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          # Source: https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
          printf '%s  %s\n' '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c' "$ARCHIVE" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$ARCHIVE" --directory "$SCANNER_DIR" gitleaks LICENSE
          printf '%s\n' "$SCANNER_DIR" >> "$GITHUB_PATH"

      - name: Scan full Git history
        shell: bash
        run: gitleaks git --redact --no-banner --log-level=warn --exit-code=1 --log-opts="--all" .
